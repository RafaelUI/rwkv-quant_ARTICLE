<rect x="36" y="150" width="150" height="150" rx="9" fill="#fff" stroke="#334" stroke-width="1.6"/>
<text x="111.0" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">0. Input</text>
<text x="111.0" y="196" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">RWKV-7 checkpoint</text>
<text x="111.0" y="212" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">(bf16)</text>
<text x="111.0" y="228" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">World tokenizer</text>
<text x="111.0" y="244" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">preset name</text>
<text x="111.0" y="290" text-anchor="middle" font-size="10" fill="#667" font-family="DejaVu Sans Mono, monospace">quantize(...)</text>
<rect x="224" y="150" width="150" height="150" rx="9" fill="#fff" stroke="#334" stroke-width="1.6"/>
<text x="299.0" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">1–2. Config</text>
<text x="299.0" y="196" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">checks before work</text>
<text x="299.0" y="212" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">preset → QuantConfig</text>
<text x="299.0" y="228" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">bits per group,</text>
<text x="299.0" y="244" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">bits_overrides,</text>
<text x="299.0" y="260" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">grid and block</text>
<text x="299.0" y="290" text-anchor="middle" font-size="10" fill="#667" font-family="DejaVu Sans Mono, monospace">presets.py</text>
<rect x="412" y="150" width="150" height="150" rx="9" fill="#fff" stroke="#334" stroke-width="1.6"/>
<text x="487.0" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">3. Statistics</text>
<text x="487.0" y="196" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">forward pass of the</text>
<text x="487.0" y="212" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">dense model:</text>
<text x="487.0" y="228" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">E[x²] per input</text>
<text x="487.0" y="244" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">channel of every</text>
<text x="487.0" y="260" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">matrix</text>
<text x="487.0" y="290" text-anchor="middle" font-size="10" fill="#667" font-family="DejaVu Sans Mono, monospace">act_stats.collect</text>
<rect x="600" y="150" width="150" height="150" rx="9" fill="#fff7ea" stroke="#c05a00" stroke-width="1.6"/>
<text x="675.0" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">4. Autopick</text>
<text x="675.0" y="196" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">harm of each matrix</text>
<text x="675.0" y="212" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">measured alone →</text>
<text x="675.0" y="228" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">“harm per byte”,</text>
<text x="675.0" y="244" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">budget +0.5% of file</text>
<text x="675.0" y="260" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">(COMPRESSION only)</text>
<text x="675.0" y="290" text-anchor="middle" font-size="10" fill="#667" font-family="DejaVu Sans Mono, monospace">autopick.select_budget</text>
<rect x="788" y="150" width="150" height="150" rx="9" fill="#fff" stroke="#334" stroke-width="1.6"/>
<text x="863.0" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">5. GPTQ</text>
<text x="863.0" y="196" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">600 windows, damp 0.1</text>
<text x="863.0" y="212" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">layer by layer:</text>
<text x="863.0" y="228" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">r,k,v → o →</text>
<text x="863.0" y="244" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">ffn.key → ffn.value,</text>
<text x="863.0" y="260" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">head last</text>
<text x="863.0" y="290" text-anchor="middle" font-size="10" fill="#667" font-family="DejaVu Sans Mono, monospace">gptq.run</text>
<rect x="976" y="150" width="150" height="150" rx="9" fill="#fff" stroke="#334" stroke-width="1.6"/>
<text x="1051.0" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">6. Writer</text>
<text x="1051.0" y="196" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">tensor by tensor</text>
<text x="1051.0" y="212" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">(mmap), RTN or</text>
<text x="1051.0" y="228" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">ready GPTQ;</text>
<text x="1051.0" y="244" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">1-D and bias stay bf16</text>
<text x="1051.0" y="260" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">→ .rwkvq file</text>
<text x="1051.0" y="290" text-anchor="middle" font-size="10" fill="#667" font-family="DejaVu Sans Mono, monospace">quantize_file</text>
<rect x="1164" y="150" width="150" height="150" rx="9" fill="#fff" stroke="#334" stroke-width="1.6"/>
