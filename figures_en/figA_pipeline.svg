<text x="1239.0" y="212" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">(codec.py);</text>
<text x="1239.0" y="228" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Metal GEMV kernels</text>
<text x="1239.0" y="244" text-anchor="middle" font-size="11.5" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">for sb6 and sym</text>
<text x="1239.0" y="290" text-anchor="middle" font-size="10" fill="#667" font-family="DejaVu Sans Mono, monospace">QuantRWKV7</text>
