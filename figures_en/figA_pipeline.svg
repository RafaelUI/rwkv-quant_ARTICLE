<text x="487.0" y="118" text-anchor="middle" font-size="11" fill="#c05a00" font-family="DejaVu Sans, Arial, sans-serif">appends bits_overrides to the config</text>
<text x="675.0" y="422" text-anchor="middle" font-size="10.5" fill="#c05a00" font-family="DejaVu Sans, Arial, sans-serif">the measurement can be taken on a strong</text>
<text x="675.0" y="437" text-anchor="middle" font-size="10.5" fill="#c05a00" font-family="DejaVu Sans, Arial, sans-serif">machine and moved as a file (like imatrix)</text>
<text x="1051.0" y="422" text-anchor="middle" font-size="10.5" fill="#245" font-family="DejaVu Sans, Arial, sans-serif">.rwkvq = safetensors + JSON:</text>
<text x="1051.0" y="437" text-anchor="middle" font-size="10.5" fill="#245" font-family="DejaVu Sans, Arial, sans-serif">config, calibration, τ, GPTQ</text>
<text x="36" y="30" font-size="18" font-weight="700" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">What quantize() does: from a bf16 checkpoint to an .rwkvq file</text>
